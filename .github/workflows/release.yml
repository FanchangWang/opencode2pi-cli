name: Release

# Publishing is triggered by pushing a version tag. One `npm publish` serves both
# hosts: pi (`pi install npm:opencode2pi-cli`) and omp (`omp install
# npm:opencode2pi-cli`) both resolve extensions out of the npm registry.
#
# The package ships TypeScript sources and zero runtime dependencies, so there is
# no build step: `files: ["src/"]` is the entire payload.
#
# Authentication, in npm's own order of preference (see DEVELOPMENT.md §12.1):
#   NPM_TOKEN secret present → token auth with --provenance. Kept as an escape
#     hatch for forks; this repository no longer sets the secret.
#   otherwise               → OIDC trusted publishing, configured on npmjs.com
#     for this package. This is the live path (proven by the v0.3.1 and v0.3.2
#     releases, whose publish steps logged "No NPM_TOKEN; using OIDC trusted
#     publishing.").

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # create the GitHub release
  id-token: write # npm provenance attestation

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          # setup-node v7 documents `package-manager-cache: false` as required
          # in publishing workflows: the cache step writes into .npmrc, which
          # can contaminate OIDC authentication. Once the Trusted Publisher is
          # configured (the plan after the first publish), that is the only
          # authentication path we have, so the risk stops being hypothetical.
          # The cost is a cold `npm ci` per release, which is seconds for the
          # four dev dependencies this package has.
          package-manager-cache: false

      # `npm test` runs `bun test`; bun is not on stock runners.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # A tag that disagrees with package.json is the failure mode that silently
      # publishes the wrong version, so it is checked before anything else.
      - name: Verify the tag matches the package version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          echo "releasing v$version"

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # The extension is multi-module and loads itself from src/, so a tarball
      # missing any file fails only at the user's first command. Derive the
      # payload from src/ itself and compare it with what was packed: a list
      # maintained by hand goes stale the moment a module is added, and the two
      # directions catch different accidents — a module left out of the tarball,
      # and a file the `files` field swept in.
      - name: Verify the packed tarball
        run: |
          set -euo pipefail
          tarball="$(npm pack --silent)"
          # `tar` output carries CRLF on Windows checkouts; strip it so the
          # exact-match assertions below hold on every runner.
          contents="$(tar -tzf "$tarball" | tr -d '\r')"
          echo "$contents"

          expected_file="$(mktemp)"
          actual_file="$(mktemp)"
          (cd src && find . -name '*.ts' -printf 'package/src/%P\n' | sort) > "$expected_file"
          printf '%s\n' "$contents" | sed -n 's|^\(package/src/[^/]*\.ts\)$|\1|p' | sort > "$actual_file"

          # An empty expectation would make the comparison below pass while
          # asserting nothing at all.
          if [ ! -s "$expected_file" ]; then
            echo "::error::src/ contains no TypeScript modules; refusing to pass vacuously"
            exit 1
          fi
          if ! diff -u "$expected_file" "$actual_file"; then
            echo "::error::the packaged src/ set does not match the repository's (missing = -, unexpected = +)"
            exit 1
          fi
          echo "TARBALL=$tarball" >> "$GITHUB_ENV"

      # Secrets are not directly readable in an `if:` expression, so the
      # presence check is done as a step and surfaced as an output.
      - name: Detect the npm token
        id: npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No NPM_TOKEN; the publish step will try OIDC trusted publishing. If no trusted publisher is configured on npmjs.com, the publish fails but the GitHub release is still produced."
          fi

      # Two authentication paths, in npm's own order of preference:
      #   NPM_TOKEN present  → token auth, provenance generated via the flag
      #   otherwise         → OIDC trusted publishing, which the npm CLI
      #                       auto-detects; provenance is generated
      #                       automatically, so --provenance must be omitted
      #                       (it is redundant, not harmful, but says nothing
      #                       true about who actually authenticated).
      #
      # Only this step is conditional. If it is skipped or fails, the tag and the
      # release must still be produced: omp and pi both install from a git ref,
      # so a release without npm is a complete, usable distribution.
      - name: Publish to npm
        id: publish
        env:
          TOKEN_AUTH: ${{ steps.npm.outputs.available }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${TOKEN_AUTH:-false}" = "true" ]; then
            echo "Authenticating with NPM_TOKEN."
            npm publish --provenance --access public
          else
            echo "No NPM_TOKEN; using OIDC trusted publishing."
            # Trusted publishing requires npm >= 11.5.1. The runner ships a
            # recent npm, but failing here with a clear message beats failing
            # later with an opaque ENEEDAUTH.
            version="$(npm --version)"
            if [ "$(printf '%s\n%s\n' "$version" 11.5.1 | sort -V | head -n1)" != "11.5.1" ]; then
              echo "::error::npm $version cannot use OIDC trusted publishing; 11.5.1 or newer is required."
              exit 1
            fi
            npm publish --access public
          fi

      - name: Create the GitHub release
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARBALL: ${{ env.TARBALL }}
          NPM_PUBLISHED: ${{ steps.publish.outcome == 'success' }}
          TOKEN_AUTH: ${{ steps.npm.outputs.available }}
        run: |
          notes="$(mktemp)"
          if [ "${NPM_PUBLISHED:-}" = "true" ]; then
            if [ "${TOKEN_AUTH:-false}" = "true" ]; then
              printf 'Published to npm as `opencode2pi-cli@%s` (authenticated with `NPM_TOKEN`).\n\n' "${GITHUB_REF_NAME#v}" > "$notes"
            else
              printf 'Published to npm as `opencode2pi-cli@%s` (authenticated with OIDC trusted publishing).\n\n' "${GITHUB_REF_NAME#v}" > "$notes"
            fi
          elif [ "${TOKEN_AUTH:-false}" = "true" ]; then
            printf '**npm publish failed for this tag** (NPM_TOKEN authentication).\n\n' > "$notes"
          else
            printf '**npm was not published for this tag** (no `NPM_TOKEN` secret and OIDC trusted publishing is not configured for this package).\n\n' > "$notes"
          fi
          cat >> "$notes" <<'EOF'
          Install:

          ```sh
          omp install npm:opencode2pi-cli
          pi install npm:opencode2pi-cli
          ```

          Requires the OpenCode CLI on PATH (`npm i -g @opencode/cli`).

          Without npm, install straight from the tag:

          ```sh
          omp install git:https://github.com/FanchangWang/opencode2pi-cli@<tag>
          pi  install git:https://github.com/FanchangWang/opencode2pi-cli@<tag>
          ```
          EOF
          sed -i "s|<tag>|$GITHUB_REF_NAME|g" "$notes"
          # An empty asset argument would be passed through to `gh` verbatim,
          # so the tarball is only added when it actually exists.
          args=(--title "$GITHUB_REF_NAME" --notes-file "$notes")
          if [ -n "${TARBALL:-}" ] && [ -f "${TARBALL:-}" ]; then
            args+=("$TARBALL")
          fi
          gh release create "$GITHUB_REF_NAME" "${args[@]}" \
            || gh release edit "$GITHUB_REF_NAME" --notes-file "$notes"

      # `stable` is the ref README installs from, so the install command in
      # README.md never has to be hand-edited when a version ships. It moves
      # last and gates nothing: a release that failed an earlier check produced
      # nothing worth pointing anybody at.
      - name: Move the stable ref to this release
        if: always()
        run: |
          git push --force origin "$GITHUB_SHA:refs/tags/stable"